<link rel="stylesheet" href="../gun/kit/web.css"><script src="../gun/kit/web.js"></script>

<div class="wade">
<list id="list">
  <a id="up">../</a>
  <a id="add">+</a>
</list>
</div>

<fit>
  <a></a>
</fit>

<iframe id="pop" src="./ls-pop.html"></iframe>

<style>
body { display: block; min-height: 0; overflow: hidden; }
#pop { display: block; width: 100%; height: 0; position: absolute; top: 33%; }
.ls, list {
  text-align: center;
  display: block;
  scroll-padding-left: 50%;
  scroll-padding-right: 50%;
  width: 100%;
  max-height: max(90vh, 26em);
  max-height: 26em;
  column-width: 8em;
  column-gap: 0.01em;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 0 0.2em; /* undo item bleed */
}
.ls a, list a, list tap {
  border: 1px solid var(--pop);
  border-radius: 0.6em;
  background: transparent;
  padding: 0.7em 0.6em;
  min-width: 3em;
  max-width: 9em;
  text-align: center;
  cursor: pointer;
  margin: 0 0.1em 0.2em 0.1em;
  
  font-weight: bold;
  user-select: none;
  display: inline-block;
  flex: 0 0 auto;
  white-space: normal;
  overflow-wrap: anywhere;
  word-break: break-all;
  line-height: 0.9em;
  back-ground: color-mix(in srgb, var(--pop) 8%, transparent);
  font-fam-ily: 'Courier New', monospace;
}
.ls a:hover, .ls a:active, list a:hover, list a:active {
  background: var(--pop);
  color: var(--mood);
  transform: scale(0.9);
}
</style>
<script src="../util.js"></script>
<script>
kit.ear('ls',function hear(eve){ hear.off();
  CMD.ls(eve.detail || eve.data, list);
});
  
// shell.html progressively enhances with ls.html
// which then progressively enhances all the cmd/*.html
kit.say([['ls','ls .'],['git','git status'],['npm','npm '],['kill','kill '],['clear','clear']], 'belt');
kit.say([['claude','claude '],['codex','codex '],['gemini','gemini '],['grok','grok ']], 'belt');

CMD = {};
CMD.ls = function(s,v,f,cmd){
  cmd = (s=s.flat()).cut('\n',ESC); s = cmd[2]; cmd = cmd[0];
  CMD.base(cmd);
  
  s = s.replaceAll('\r\n','\t').replaceAll('\r','\t').replaceAll('\n','\t').replaceAll(/\s{2,}/g,'\t');
  f = (s.indexOf('\t')+1)? '\t' : /\s+/;
  s = s.split(f).sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()));
  
  s.forEach((item,a)=>{
    if(!(item = item.flat().trim())){ return }
    (a = B.new('fit a')).where = item;
    a.file = (item.includes('.') && item !== '.' && item !== '..');
    a.textContent = item + (a.file? '' : '/');
    add.pin(a,-1);
  });

  v.scrollLeft = (v.scrollWidth - v.clientWidth) / 2;
};

CMD.path = '~';
CMD.base = function(cmd, hit){
  hit = cmd.match(/\bcd\s+(.+?)\s+&&\s+ls\b/);
  if(hit){ CMD.path = hit[1].replace(/\\(.)/g, '$1') }
};
CMD.go = function(item, part, out){
  part = (CMD.path + '/' + item).split('/');
  out = [];
  part.forEach(function(v){
    if(!v || '.' === v){ return }
    if('..' === v){ if(out.length > 1){ out.pop() } return }
    out.push(v);
  });
  return out.join('/') || '~';
};
CMD.arg = function(path){ return path.replace(/[^\w@%+=:,./~-]/g, '\\$&') };
up.where = '..';

B.ear('contextmenu', function(eve, a){ a = eve.target.closest('list a');
  if(!a || !a.where){ return }
  eve.preventDefault();
  kit.say(a.where, 'ls.pop', pop);
});

B.ear('click',(eve, a, path, cmd)=>{ a = eve.target.closest('a');
  if(!a || !a.closest('list')){ return }
  if(!a.where){ return }
  if(a.file){
    kit.say('cat '+a.where, 'prompt.set');
    kit.say('cat '+a.where, 'prompt');
    return;
  }
  path = CMD.go(a.where);
  cmd = 'cd '+CMD.arg(path)+' && ls .';
  kit.say(localStorage.pwd = cmd, 'prompt.set');
  kit.say({run:cmd, cmd:'ls .', bin:'ls'}, 'prompt.same');
});

(async function(){ return;
  kit.say('ls .\nasdf\tqwertyuiop\thjkl\tzxcvbnmtyrueiwoqp1\tbnvm', 'ls');
}());
</script>
