<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.json">
<script>navigator?.serviceWorker.register?.('./sw.js')</script>
<link rel="stylesheet" href="./gun/kit/web.css"><script src="./gun/kit/web.js"></script>

<form id="sign">
  <input id="host" name="host" placeholder="host:" class="fog sap lip">
  <input id="pass" name="pass" type="password" placeholder="pass:" class="fog sap lip">
  <button type="submit"></button>
</form>

<style>
:root { --fill: var(--mood); }
#sign { flex-shrink: 0; }
iframe { width: 100%; flex: 1; min-height: 0; height: 0 !important; border: none; display: block; }
input::placeholder { opacity: 1; }
</style>

<script src="util.js"></script>
<script>;(function(cop){

location.hash = '';
host.focus();
console.off=1;

sign.onsubmit = cop.sign = async (eve)=>{ eve?.preventDefault?.(); if(cop.ws){ return }
  
  cop.ws = new WebSocket((localStorage.host=host.value).replace(/^http/,'ws')||'ws://localhost:8022');

  cop.ws.onopen = ()=>{ cop.wait = 999;
    cop.ws.send(localStorage.pass = (pass.value || localStorage.pass || ''));
    while((cop.limbo||[]).length){ cop.ws.send(cop.limbo.shift()) }
    location.path = 'shell.html';
  };
  cop.ws.onmessage = (eve) => { kit.say(eve.data,'chat') };
  cop.ws.onerror = (err) => { host.value = err.reason||'failed' };
  cop.ws.onclose = (eve) => { cop.ws = 0;
    if('cannot pass' === eve.reason){ localStorage.pass = ''; location.reload(); return }
    setTimeout(() => { cop.wait = Math.min(cop.wait * 2, 30000); cop.sign() }, cop.wait = cop.wait || 999);
  };
};

localStorage.pass && cop.sign();

kit.ear('host',(eve,cmd,no)=>{
  if(no === (cmd = eve.detail||eve.data)){ return }
  var msg = (typeof cmd === 'string') ? cmd : JSON.stringify(cmd);
  if(!cop.ws){ (cop.limbo = cop.limbo||[]).push(msg); return }
  cop.ws.send(msg);
});

}(window.cop = {}));
</script>
<script src="vm/boot.js"></script>
<script src="vm/demo.js"></script>
